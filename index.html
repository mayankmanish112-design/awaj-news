<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>आवाज़ बुंदेलखंड न्यूज़ - डिजिटल मीडिया नेटवर्क</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Tiro+Devanagari+Hindi&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <!-- Firebase App & Services (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        .font-brand { font-family: 'Yatra One', cursive; }
        .font-devnagari { font-family: 'Tiro Devanagari Hindi', serif; }
        .font-signature { font-family: 'Dancing Script', cursive; }
        @media print {
            body * { visibility: hidden; }
            #digitalCardPrintArea, #digitalCardPrintArea * { visibility: visible; }
            #digitalCardPrintArea { position: absolute; left: 0; top: 0; margin: auto; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col text-gray-800">

    <!-- Top Navigation Header -->
    <header class="bg-gradient-to-r from-red-800 via-red-700 to-red-800 text-white shadow-lg sticky top-0 z-40 border-b-2 border-yellow-500">
        <div class="max-w-4xl mx-auto px-4 py-2.5 flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <!-- Portal Logo Icon -->
                <div class="w-10 h-10 bg-white rounded-lg flex flex-col items-center justify-center p-0.5 shadow border border-yellow-400">
                    <span class="text-red-700 font-extrabold text-[9px] leading-tight font-brand">आवाज़</span>
                    <span class="bg-blue-900 text-white text-[7px] font-black px-1 rounded-sm w-full text-center">NEWS</span>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight font-brand leading-none">आवाज़ बुंदेलखंड <span class="text-yellow-400">NEWS</span></h1>
                    <span class="text-[10px] text-red-100 tracking-wider block font-devnagari">डिजिटल मीडिया नेटवर्क | निष्पक्ष पत्रकारिता</span>
                </div>
            </div>
            
            <div id="authHeaderArea" class="flex items-center">
                <button type="button" id="btnLoginOpen" onclick="openLoginModal()" class="text-xs bg-yellow-400 hover:bg-yellow-300 text-red-950 font-black px-3.5 py-1.5 rounded-full shadow transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-id-badge text-sm"></i> <span>स्टाफ़ लॉगिन</span>
                </button>
                <div id="userProfileBadge" class="hidden flex items-center space-x-2">
                    <span id="userRoleBadge" class="text-[11px] bg-red-950 border border-yellow-500 text-yellow-300 px-3 py-1 rounded-full font-bold"></span>
                    <button type="button" onclick="logoutDirect()" title="लॉगआउट" class="text-xs bg-black/50 hover:bg-black/75 text-white p-1.5 rounded-full cursor-pointer"><i class="fa-solid fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs for Logged-in Staff -->
    <nav id="staffNavigation" class="hidden bg-white border-b border-gray-200 sticky top-[57px] z-30 shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-around text-xs font-bold overflow-x-auto">
            <button type="button" onclick="switchTab('feed')" id="tabFeed" class="py-3 px-2 border-b-2 border-red-700 text-red-700 whitespace-nowrap"><i class="fa-solid fa-newspaper mr-1"></i> मुख्य बुलेटिन</button>
            <button type="button" onclick="switchTab('reporter')" id="tabReporter" class="py-3 px-2 border-b-2 border-transparent text-gray-500 whitespace-nowrap"><i class="fa-solid fa-pen-to-square mr-1"></i> नई ख़बर भेजें</button>
            <button type="button" onclick="switchTab('myCard')" id="tabMyCard" class="py-3 px-2 border-b-2 border-transparent text-gray-500 whitespace-nowrap"><i class="fa-solid fa-address-card mr-1"></i> मेरा डिजिटल कार्ड</button>
            <button type="button" onclick="switchTab('wallet')" id="tabWallet" class="py-3 px-2 border-b-2 border-transparent text-gray-500 whitespace-nowrap"><i class="fa-solid fa-wallet mr-1"></i> मानदेय / पर्स</button>
            <button type="button" onclick="switchTab('admin')" id="tabAdmin" class="hidden py-3 px-2
